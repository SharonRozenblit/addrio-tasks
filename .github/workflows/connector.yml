name: Deploy connector

on:
  push:
    branches: [main]
    paths: ["connector/**", ".github/workflows/connector.yml"]
  workflow_dispatch:

concurrency: connector

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connector
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Find the workers.dev address
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          if [ -z "$sub" ] || [ "$sub" = "null" ]; then
            echo "::error::No workers.dev subdomain yet. Open Workers & Pages in the Cloudflare dashboard once to create it."; exit 1
          fi
          echo "PUBLIC_URL=https://addrio-tasks-mcp.$sub.workers.dev" >> "$GITHUB_ENV"

      - name: Make sure the OAuth KV namespace exists
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?per_page=100" | jq -r '.result[] | select(.title=="addrio-tasks-mcp-oauth") | .id')
          if [ -z "$id" ]; then
            id=$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              -d '{"title":"addrio-tasks-mcp-oauth"}' "$api" | jq -r '.result.id')
          fi
          sed -i "s/__KV_ID__/$id/; s#__PUBLIC_URL__#$PUBLIC_URL#" wrangler.jsonc

      - run: npx wrangler deploy

      - name: Set Google sign-in secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          jq -n --arg id "$GOOGLE_CLIENT_ID" --arg s "$GOOGLE_CLIENT_SECRET" '{GOOGLE_CLIENT_ID:$id, GOOGLE_CLIENT_SECRET:$s}' > "$RUNNER_TEMP/s.json"
          npx wrangler secret bulk "$RUNNER_TEMP/s.json"; rm -f "$RUNNER_TEMP/s.json"

      - name: Connector address
        run: |
          echo "Connector URL: $PUBLIC_URL/mcp" >> "$GITHUB_STEP_SUMMARY"
          echo "Google redirect URI: $PUBLIC_URL/callback" >> "$GITHUB_STEP_SUMMARY"
