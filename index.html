<!doctype html>
<html lang="he" dir="rtl">
<head>
<title>Addrio Tasks</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff347f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Addrio Tasks">
<link rel="icon" href="public/icons/icon-192.png">
<link rel="apple-touch-icon" href="public/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky brand bar + view tabs on top, view canvas below, detail drawer slides in from the inline-end edge. Phone: views move to a bottom tab bar. Light-only by product decision. */
:root{
  color-scheme:light;
  --bg:#f7f4f6; --surface:#ffffff; --sunken:#f1ecef; --fg:#231c21; --muted:#6f6169; --faint:#a3959d; --line:#e7dde3;
  --pink:#ff347f; --pink2:#ff47ae; --pink-ink:#c2185f; --pink-soft:#ffe6f0;
  --grad:linear-gradient(135deg,var(--pink) 0%,var(--pink2) 100%);
  /* statuses (approved) */
  --st-todo:#6b7280; --st-todo-bg:#eef0f3;
  --st-prog:#1d6fd8; --st-prog-bg:#e3eefc;
  --st-rev:#7c4ddb; --st-rev-bg:#efe8fd;
  --st-done:#1f9254; --st-done-bg:#e2f4ea;
  --st-hold:#b26a00; --st-hold-bg:#fdf0d9;
  --st-block:#d9480f; --st-block-bg:#fde8df;
  --st-nr:#9aa0a8; --st-nr-bg:#f2f3f5;
  --over:#d61f3a; --over-bg:#fde4e8;
  /* areas */
  --ar-mgmt:#4c6ef5; --ar-mkt:#f76707; --ar-dev:#0c8599; --ar-des:#ae3ec9; --ar-inv:#c99700; --ar-res:#8d5a3b;
  --f-display:"Rubik","Assistant",system-ui,sans-serif;
  --f-body:"Assistant","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(60,20,40,.06),0 4px 16px rgba(60,20,40,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#fbf6f2;color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
bdi.code,.code{font-family:var(--f-mono);font-weight:600;font-size:.82em;letter-spacing:.02em;direction:ltr;unicode-bidi:isolate}
.app,.drawer,.modal,.pop,.scrim{direction:rtl}
.app{min-height:100%}
.bgimg{position:fixed;inset:0;z-index:-1;background:#fbf6f2 url(public/bg.jpg) 22% 62%/cover no-repeat;pointer-events:none}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;place-items:center;padding-block:40px}
.login-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:36px 28px;text-align:center;box-shadow:var(--shadow)}
.login-card img{width:72px;height:auto}
.login-card h1{font-family:var(--f-display);font-size:28px;margin:14px 0 2px}
.slogan{font-family:var(--f-display);font-weight:600;direction:ltr;margin:0 0 22px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:17px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 16px;font-weight:700}
.gbtn:hover{background:var(--sunken)}
.login small{display:block;color:var(--muted);margin-top:14px;font-size:13px}
.who{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px}
.who button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:start;display:flex;gap:10px;align-items:center}
.who button:hover{border-color:var(--pink)}
.who b{display:block;font-size:14px}.who span{font-size:12px;color:var(--muted)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:58px}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand img{width:32px;height:32px;border-radius:8px}
.co{display:flex;align-items:center;gap:8px;flex:none}
.co img{width:20px;height:auto}
.co span{font-family:var(--f-display);font-weight:600;font-size:13px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.co-bar{padding-inline-start:14px;border-inline-start:1px solid var(--line);height:28px}
.co-strip{display:none}
.co-login{justify-content:center;margin:6px 0 22px}
.co-login img{width:24px}.co-login span{font-size:16px}
.login-card img.appicon{width:84px;height:84px;border-radius:20px;box-shadow:0 6px 18px rgba(255,52,127,.28)}
.brand b{font-family:var(--f-display);font-size:18px;letter-spacing:-.01em}
.brand i{font-style:normal;font-size:11px;color:var(--muted);direction:ltr;display:block;line-height:1}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--sunken);border-radius:999px;padding:8px 38px 8px 64px}
.search input:focus{background:var(--surface);border-color:var(--pink);outline:none}
.search svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search kbd{position:absolute;left:10px;top:50%;transform:translateY(-50%)}
kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;direction:ltr;display:inline-block;line-height:18px}
.counters{display:flex;gap:4px;margin-inline-start:auto}
.cnt{position:relative;border:0;background:transparent;border-radius:10px;width:40px;height:40px;font-size:19px;display:grid;place-items:center}
.cnt:hover{background:var(--sunken)}
.cnt .n{position:absolute;top:3px;inset-inline-end:2px;min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--f-body)}
.cnt.warn .n{background:var(--over)}
.cnt .n[data-z="0"]{display:none}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 3px 3px 10px}
.me span{font-size:13px;font-weight:600}
.adm{font-size:10px;font-weight:700;color:var(--pink-ink);background:var(--pink-soft);border-radius:4px;padding:0 5px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.av.sm{width:22px;height:22px;font-size:10px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;height:44px;align-items:stretch}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:0 12px;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--pink)}
.tab .k{font-size:11px;color:var(--faint);font-family:var(--f-mono);direction:ltr}
.tab .pill{font-size:11px;background:var(--sunken);border-radius:999px;padding:0 6px;color:var(--muted)}
.tabs .sp{flex:1}
.newbtn{align-self:center;border:0;color:#fff;background:var(--grad);border-radius:999px;padding:7px 14px;font-weight:700;display:flex;gap:8px;align-items:center;white-space:nowrap}
.newbtn kbd{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.35);color:#fff}
.login .err{color:var(--over);font-size:14px;font-weight:600;max-width:32ch;text-align:center}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--st-done);display:inline-block}
.syncdot.off{background:var(--faint)}
.demo-note{font-size:12px;color:var(--muted);background:#f3eef1;text-align:center;padding:4px 0}

/* ---------- sprint strip ---------- */
.sprint{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:14px}
.sprint h2{font-family:var(--f-display);font-size:20px;margin:0;text-wrap:balance}
.sprint .goal{color:var(--muted);font-size:14px;max-width:70ch}
.sprint .goal b{color:var(--fg)}
.prog{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden;min-width:120px}
.prog > i{display:block;height:100%;background:var(--grad);border-radius:3px}
.sprint .meta{display:flex;align-items:center;gap:10px;margin-inline-start:auto;font-size:13px;color:var(--muted)}

main{padding-block:4px 0}
main::after{content:"";display:block;height:90px}
.tl-row .lbl .code,td .code{white-space:nowrap}

/* ---------- tags ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;white-space:nowrap;line-height:20px}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-todo{color:var(--st-todo);background:var(--st-todo-bg)} .t-prog{color:var(--st-prog);background:var(--st-prog-bg)}
.t-rev{color:var(--st-rev);background:var(--st-rev-bg)} .t-done{color:var(--st-done);background:var(--st-done-bg)}
.t-hold{color:var(--st-hold);background:var(--st-hold-bg)} .t-block{color:var(--st-block);background:var(--st-block-bg)}
.t-nr{color:var(--st-nr);background:var(--st-nr-bg);text-decoration:line-through}
.t-over{color:#fff;background:var(--over)} .t-over::before{background:#fff}
.t-draft{color:var(--muted);background:transparent;border:1px dashed var(--faint)}
.prio{font-family:var(--f-mono);font-size:11px;font-weight:600;border-radius:5px;padding:0 5px;line-height:18px;direction:ltr}
.p1{background:var(--over-bg);color:var(--over)} .p2{background:#fff1db;color:#a05a00} .p3{background:var(--sunken);color:var(--muted)}
.area{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.area i{width:8px;height:8px;border-radius:2px;display:inline-block}
.area.sec{opacity:.75}
.due{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.due.over{color:var(--over);font-weight:700}
.due.soon{color:#a05a00;font-weight:700}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
@media (min-width:1101px){.board{overflow:visible}}
@media (max-width:1100px){.col h3{position:static!important;box-shadow:none!important}}
.col{background:rgba(243,237,240,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:12px;padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px}
.col.drop{outline:2px dashed var(--pink);outline-offset:-2px;background:var(--pink-soft)}
.col h3{position:sticky;top:var(--hh,130px);z-index:2;background:#f4eff2;box-shadow:0 -10px 0 #f4eff2;border-radius:8px;padding:6px 4px;margin:0 0 2px;font-family:var(--f-display);font-size:14px;margin:2px 4px 4px;display:flex;align-items:center;gap:8px}
.col h3 .c{font-family:var(--f-body);color:var(--muted);font-weight:600;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 10px;border-inline-start:4px solid var(--a,#ccc);display:flex;flex-direction:column;gap:7px;cursor:pointer;text-align:start;width:100%}
.card:hover{box-shadow:var(--shadow)}
.card.dragging{opacity:.4}
.card.over{background:linear-gradient(0deg,var(--over-bg),var(--over-bg)),var(--surface);border-color:#f6b8c3}
.card .r1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .r1 .code{color:var(--muted)}
.card .ttl{font-weight:600;line-height:1.35}
.card .r3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .r3 .sp{flex:1}
.card .former{font-size:11px;color:var(--faint)}
.card .epicname{font-size:12px;color:var(--muted)}
.state-flag{font-size:11px;font-weight:700}

/* ---------- list ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:14px}
.filters label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--over);border-color:#f6b8c3}
.tblwrap{overflow:auto;max-height:calc(100dvh - var(--hh,130px) - 24px - var(--bn,0px));overscroll-behavior:contain;position:sticky;top:calc(var(--hh,130px) + 8px);z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;z-index:2;text-align:start;font-size:12px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer} tr.row:hover td{background:#fcf9fb}
tr.grp td{position:sticky;top:37px;z-index:1;background:#f3eef1;font-weight:700;font-size:13px;padding:6px 12px}
td.ttl{min-width:240px;font-weight:600}
td .sub{color:var(--faint);font-weight:400;padding-inline-start:16px}

/* ---------- timeline ---------- */
.tl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100dvh - var(--hh,130px) - 24px - var(--bn,0px));overscroll-behavior:contain;position:sticky;top:calc(var(--hh,130px) + 8px);z-index:4}
.tl-in{min-width:880px;position:relative}
.tl-head,.tl-row{display:grid;grid-template-columns:260px 1fr}
.tl-head{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:5}
.tl-row .lbl,.tl-head .lbl{position:sticky;inset-inline-start:0;background:var(--surface);z-index:3;border-inline-end:1px solid var(--line)}
.tl-head .lbl{padding:8px 12px;font-size:12px;color:var(--muted);font-weight:700}
.months{position:relative;height:34px}
.months span{position:absolute;top:0;bottom:0;border-inline-start:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);padding:8px 8px}
.tl-row{border-bottom:1px solid var(--line);min-height:40px}
.tl-row .lbl{padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:14px;min-width:0;cursor:pointer}
.tl-row .lbl .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-row.epic .lbl{font-weight:700;font-family:var(--f-display)}
.tl-row.child .lbl{padding-inline-start:30px;color:var(--muted)}
.lane{position:relative}
.gbar{position:absolute;top:50%;height:16px;transform:translateY(-50%);border-radius:5px;background:var(--a);opacity:.9;cursor:pointer;min-width:6px}
.tl-row.epic .gbar{height:22px;opacity:1;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden}
.gbar.done{opacity:.35}
.gbar.over{outline:2px solid var(--over);outline-offset:1px}
.gbar .dl{position:absolute;inset-inline-end:-5px;top:50%;width:9px;height:9px;transform:translateY(-50%) rotate(45deg);background:var(--fg);border:2px solid var(--surface)}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--pink);z-index:1;pointer-events:none}
.today b{position:absolute;top:2px;transform:translateX(50%);background:var(--pink);color:#fff;font-size:10px;border-radius:4px;padding:0 4px;white-space:nowrap}
.sband{position:absolute;top:0;bottom:0;background:var(--pink-soft);opacity:.55;pointer-events:none}

/* ---------- team / mywork / sprint cards ---------- */
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard h3{font-family:var(--f-display);font-size:17px;margin:0;display:flex;align-items:center;gap:10px}
.pcard .role{font-size:13px;color:var(--muted);margin-top:-6px}
.mini{display:flex;flex-direction:column;gap:6px}
.mini button{display:flex;align-items:flex-start;gap:8px;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
.mini button:hover{border-color:var(--faint)}
.mini .mt{flex:1;min-width:0}
.mini .mt b{font-weight:600;display:block;line-height:1.35}
.mini .mt span{font-size:12px;color:var(--muted)}
.dist{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunken)}
.dist i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.w{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;grid-column:span 6;display:flex;flex-direction:column;gap:12px}
.w.s3{grid-column:span 3}.w.s4{grid-column:span 4}.w.s8{grid-column:span 8}.w.s12{grid-column:span 12}
.w h3{font-family:var(--f-display);font-size:15px;margin:0;display:flex;align-items:center;gap:8px}
.w h3 .sp{flex:1}
.kpi .num{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .lab{color:var(--muted);font-size:13px}
.kpi.bad .num{color:var(--over)}
.erow{display:grid;grid-template-columns:minmax(0,1.3fr) 2fr auto;gap:12px;align-items:center;font-size:14px}
.erow .p{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden;display:flex}
.erow .p i{display:block;height:100%}
.erow .v{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.lrow{display:grid;grid-template-columns:90px 1fr 28px;gap:10px;align-items:center;font-size:14px}
.lrow .bars{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunken)}
.lrow .bars i{display:block;height:100%}
.lrow .v{font-variant-numeric:tabular-nums;text-align:end;color:var(--muted)}
.addw{border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-weight:700;min-height:90px;background:transparent;grid-column:span 12}
.addw:hover{border-color:var(--pink);color:var(--pink-ink)}
.moves li{margin-bottom:6px}

/* ---------- ideas / drafts / messages ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.idea h4{margin:0;font-family:var(--f-display);font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.idea .meta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.idea .acts{display:flex;gap:6px;flex-wrap:wrap}
.istat{font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px}
.i-new{background:var(--pink-soft);color:var(--pink-ink)} .i-rev{background:var(--st-prog-bg);color:var(--st-prog)}
.i-ok{background:var(--st-done-bg);color:var(--st-done)} .i-no{background:var(--sunken);color:var(--muted)}
.unseen{width:8px;height:8px;border-radius:50%;background:var(--pink);display:inline-block}
.form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;position:sticky;top:120px}
.form h3{margin:0;font-family:var(--f-display);font-size:16px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld > span{font-size:13px;font-weight:700;color:var(--muted)}
.fld > span em{color:var(--pink-ink);font-style:normal}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);width:100%}
.fld textarea{min-height:70px;resize:vertical}
.fld.miss input,.fld.miss select,.fld.miss textarea{border-color:var(--over);background:var(--over-bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chat{display:grid;grid-template-columns:240px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:420px;overflow:hidden}
.chat .people{border-inline-end:1px solid var(--line);display:flex;flex-direction:column}
.chat .people button{border:0;background:none;text-align:start;padding:12px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.chat .people button[aria-current="true"]{background:var(--pink-soft)}
.chat .people small{display:block;color:var(--muted);font-size:12px}
.thread{display:flex;flex-direction:column}
.msgs{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.bub{max-width:75%;padding:8px 12px;border-radius:12px;background:var(--sunken);align-self:flex-start}
.bub.mine{align-self:flex-end;background:var(--pink-soft)}
.bub small{display:block;font-size:11px;color:var(--muted)}
.bub a{color:var(--pink-ink);font-weight:700;text-decoration:none}
.compose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.compose input{flex:1;border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.empty{color:var(--muted);text-align:center;padding:30px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(35,20,30,.28);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(560px,100%);background:var(--surface);z-index:71;transform:translateX(-102%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(35,20,30,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.drawer.on{transform:none}
.dh{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.dh .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dh h2{font-family:var(--f-display);font-size:21px;margin:0;line-height:1.3;text-wrap:balance}
.dh .x{margin-inline-start:auto}
.db{flex:1;overflow-y:auto;padding:16px 20px 30px;display:flex;flex-direction:column;gap:18px}
.sec h4{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.sec h4 .sp{flex:1}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:14px;align-items:center}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.path{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--faint)}
.step .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;background:var(--surface)}
.step.past{color:var(--muted)} .step.past .dot{background:var(--st-done);border-color:var(--st-done);color:#fff}
.step.cur{color:var(--fg)} .step.cur .dot{border-color:var(--pink);color:var(--pink-ink)}
.step.click{cursor:pointer}.step.click:hover .dot{border-color:var(--pink)}
.step.skip{opacity:.45;text-decoration:line-through}
.step + .step::before{content:"";width:22px;height:2px;background:var(--line);margin-inline:4px}
.span{position:relative;height:40px;margin-top:4px}
.span .track{position:absolute;top:14px;inset-inline:0;height:6px;border-radius:3px;background:var(--sunken)}
.span .fill{position:absolute;top:14px;height:6px;border-radius:3px;background:var(--grad)}
.span .tk{position:absolute;top:26px;font-size:11px;color:var(--muted);white-space:nowrap}
.span .nowm{position:absolute;top:8px;width:2px;height:18px;background:var(--fg)}
.box{background:var(--sunken);border-radius:8px;padding:10px 12px;font-size:14px}
.dod{border-inline-start:3px solid var(--st-done);background:var(--st-done-bg)}
.chk{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.chk label{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk input{margin-top:4px;accent-color:var(--pink)}
.chk .done{text-decoration:line-through;color:var(--faint)}
ol.chk{counter-reset:s} ol.chk li{counter-increment:s} ol.chk label::before{content:counter(s) ".";font-weight:700;color:var(--muted);min-width:16px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.links ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.links a{color:var(--fg);text-decoration:none;font-size:14px;display:flex;gap:6px;align-items:center}
.links a:hover{color:var(--pink-ink)}
.links .lt{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.cm{display:flex;gap:10px}
.cm .b{flex:1;min-width:0}
.cm .b small{color:var(--muted);font-size:12px}
.cm .b p{margin:2px 0 0;font-size:14px}
.cm.new .b{background:var(--pink-soft);border-radius:8px;padding:6px 8px}
.addc{display:flex;gap:8px;margin-top:6px}
.addc input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.hist{list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.hist b{color:var(--fg);font-weight:600}
.hist .why{display:block;color:var(--fg);font-size:13px;background:var(--sunken);border-radius:6px;padding:2px 8px;margin-top:2px}
.children .mini button{padding:6px 8px}

/* ---------- modal / popovers / toast ---------- */
.modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:20px;background:rgba(35,20,30,.35)}
.modal.on{display:grid}
.mbox{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:calc(100% - 40px);overflow-y:auto;box-shadow:0 20px 60px rgba(35,20,30,.3)}
.mbox.sm{width:min(440px,100%)}
.mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);z-index:2}
.mh h3{margin:0;font-family:var(--f-display);font-size:18px;flex:1}
.mb{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center;position:sticky;bottom:0;background:var(--surface);z-index:2;flex-wrap:wrap}
.mf .note{margin-inline-end:auto;font-size:13px;color:var(--muted)}
.req-note{font-size:13px;background:var(--sunken);border-radius:8px;padding:8px 10px;color:var(--muted)}
.paths{display:flex;gap:8px;flex-wrap:wrap}
.paths label{display:flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.pop{position:fixed;z-index:75;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(35,20,30,.18);width:min(360px,calc(100% - 32px));max-height:70vh;overflow-y:auto;display:none}
.pop.on{display:block}
.pop h4{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-family:var(--f-display);font-size:15px}
.pop .it{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);text-align:start;width:100%;background:none;border-inline:0;border-top:0;font-size:14px}
.pop .it:hover{background:var(--sunken)}
.pop .it small{display:block;color:var(--muted);font-size:12px}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--fg);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;direction:rtl}
.toast.on{opacity:1;transform:translateX(-50%)}
.help table td{padding:6px 8px;font-size:14px} .help table td:first-child{white-space:nowrap}
.res{position:absolute;top:calc(100% + 6px);inset-inline:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:none;max-height:360px;overflow-y:auto}
.res.on{display:block}
.res button{display:flex;gap:10px;width:100%;text-align:start;border:0;background:none;padding:9px 12px;align-items:center;font-size:14px}
.res button:hover,.res button.hl{background:var(--sunken)}
.res small{color:var(--faint);font-size:12px}

/* ---------- bottom nav (phone) ---------- */
.bnav{display:none}
@media (max-width:760px){
  .search{display:none} .me{display:none}
  input,select,textarea{font-size:16px!important}
  .modal{padding:0;place-items:end stretch}
  .mbox,.mbox.sm{width:100%;max-height:92dvh;border-radius:16px 16px 0 0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .mf{padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
  .mf .note{flex-basis:100%}
  body.present .pres-badge,.pres-exit .pt,.pres-exit kbd{display:none!important}
  body.present .bar{height:58px;gap:8px} body.present .brand b{font-size:18px} body.present .brand img{width:30px;height:30px} body.present .pres-exit{padding:6px 10px} body.present .brand > div{display:none}
  .bgimg{background:#faf5ee url(public/bg-m.jpg) 50% 100%/cover no-repeat}
  .pop.sheet{left:0!important;right:0;top:auto!important;bottom:calc(58px + env(safe-area-inset-bottom,0px));width:100%;max-height:calc(100dvh - 140px);border-radius:16px 16px 0 0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:8px}
  .pop:not(.sheet){max-height:calc(100dvh - 140px)}
  .co-bar{display:none} .co-strip{display:flex;justify-content:center;padding:6px 0;border-top:1px solid var(--line)}
  .tabs .newbtn kbd,.tab .k{display:none}
  .board{grid-template-columns:repeat(4,minmax(78vw,1fr));scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .two,.chat{grid-template-columns:minmax(0,1fr)}
  .chat .people{flex-direction:row;overflow-x:auto;border-inline-end:0;border-bottom:1px solid var(--line)}
  .chat .people button{border-bottom:0;white-space:nowrap}
  .form{position:static}
  .dash .w,.dash .w.s3,.dash .w.s4,.dash .w.s8{grid-column:span 12}
  .dash .w.kpi{grid-column:span 6}
  .erow{grid-template-columns:minmax(0,1fr) 1fr auto}
  .links,.row2{grid-template-columns:1fr}
  :root{--bn:64px}
  .bnav{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bnav button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
  .bnav button span{font-size:18px;line-height:1}
  .bnav button[aria-selected="true"]{color:var(--pink-ink)}
  .kv{grid-template-columns:96px 1fr}
}

/* ---------- presentation mode (TV) ---------- */
body.present{font-size:19px}
body.present .search,body.present .newbtn,body.present .demo-note,body.present .me{display:none}
body.present .bar{height:72px} body.present .brand img{width:40px;height:40px} body.present .brand b{font-size:24px}
body.present .card .ttl{font-size:18px} body.present .tab{font-size:17px}
body.present .sprint h2{font-size:28px}
body.present .board{grid-template-columns:repeat(4,minmax(300px,1fr))}
.pres-badge,.pres-exit{display:none}
body.present .pres-exit{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
body.present .pres-exit:hover{border-color:var(--pink);color:var(--pink-ink)}
body.present .pres-badge{display:inline-flex;font-size:12px;font-weight:700;color:var(--pink-ink);background:var(--pink-soft);border-radius:6px;padding:2px 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="pop" id="pop"></div>
<div class="toast" id="toast" role="status"></div>

const isOver=u=>u.due&&u.status!=="done"&&u.state!=="nr"&&u.due<TODAY;
const isSoon=u=>u.due&&u.status!=="done"&&!isOver(u)&&days(TODAY,u.due)<=2;
const kids=c=>U.filter(u=>u.parent===c);

function stTag(u){
  if(u.type==="epic")return "";
  let h=`<span class="tag ${ST[u.status][1]}">${ST[u.status][0]}</span>`;
  if(u.state)h+=` <span class="tag ${STATES[u.state][1]}">${STATES[u.state][0]}</span>`;
  if(isOver(u))h+=` <span class="tag t-over">חריגה</span>`;
  return h;
}
const dueH=u=>`<span class="due${isOver(u)?" over":isSoon(u)?" soon":""}">${isOver(u)?"עבר ":""}${fmt(u.due)}</span>`;
function epicProg(c){const d=desc(c).filter(u=>u.state!=="nr");const done=d.filter(u=>u.status==="done").length;return{done,total:d.length,pct:d.length?Math.round(done/d.length*100):0}}

/* ---------- counters ---------- */
function counts(){
  const nc=U.reduce((n,u)=>n+(u.comments||[]).filter(c=>unreadCm(u,c)).length,0);
  const nm=(hub()?Object.keys(MSGS):[me]).filter(unreadMsg).length;
  const ni=can()?IDEAS.filter(i=>i.by!==me&&(i.ts||i.at)>SEEN.ideas).length:0;
  const no=U.filter(isOver).length;
  return{nc,nm,ni,no};
}

  if(t.dataset.chk!=null){const u=get(openCode);u.checklist.items[+t.dataset.chk][1]=t.checked?1:0;persist();drawDrawer()}
});
document.addEventListener("input",e=>{
  if(e.target.id!=="q")return;const q=e.target.value.trim();const r=$("#res");
  if(!q){r.classList.remove("on");return}
  const l=U.filter(u=>(u.code+" "+u.title+" "+(u.former||"")+" "+(u.desc||"")+" "+(u.dod||"")).toLowerCase().includes(q.toLowerCase())).slice(0,8);
  r.innerHTML=l.map((u,i)=>`<button data-open="${u.code}" class="${i?"":"hl"}">${code(u.code)}<span style="flex:1">${esc(u.title)}${u.former&&u.former.toLowerCase().includes(q.toLowerCase())?` <small>(לשעבר ${u.former})</small>`:""}</span>${stTag(u)}</button>`).join("")||'<div class="empty" style="padding:14px">לא נמצאו יחידות</div>';r.classList.add("on");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="q"){const b=$("#res .hl");b&&b.click();return}
  if(e.key==="Escape"){if($("#modal").classList.contains("on"))closeModal();else if($("#drawer").classList.contains("on")||$("#pop").classList.contains("on"))closeAll();else if(document.body.classList.contains("present"))togglePresent();return}
  if(!me)return;
  const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if($("#modal").classList.contains("on")&&$("#modal").dataset.kind==="prio"&&/^[123]$/.test(e.key)&&$("#modal [data-pick]")){pick("P"+e.key);return}
  if(typing)return;
  if(e.key==="?"){e.preventDefault();help();return}
  const mod=MAC?e.ctrlKey&&!e.metaKey:e.altKey;if(!mod)return;
  const k=e.code;
  if(gPending){gPending=false;const m={KeyM:"mine",KeyB:"board",KeyL:"list",KeyT:"timeline",KeyD:"dash"}[k];if(m){e.preventDefault();go(m)}return}
  const act={
    Slash:()=>{const q=$("#q");if(q&&q.offsetParent)q.focus();else toast("החיפוש זמין במחשב")},
    KeyC:()=>newUnit(), KeyG:()=>{gPending=true;setTimeout(()=>gPending=false,1500)},
    KeyE:()=>openCode&&editUnit(), KeyP:()=>openCode&&picker("prio"), KeyA:()=>openCode&&picker("own"),
    KeyM:()=>{if(openCode){const c=$("#cin");c&&c.focus()}}, KeyS:()=>openCode&&nextStatus(), KeyD:()=>openCode&&moveDeadline(),
    KeyR:()=>{const i=IDEAS.find(x=>x.status==="rev");if(view==="ideas"&&i&&can())ideaAct("draft",i.id)}, Period:()=>togglePresent()
  }[k];
  if(act){e.preventDefault();act()}
});
function togglePresent(){document.body.classList.toggle("present");toast(document.body.classList.contains("present")?"מצב הצגה פעיל · "+MOD+". ליציאה":"מצב הצגה כבוי")}

/* drag & drop on the board */
let dragCode=null;
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest(".card");if(!c)return;if(!can()){e.preventDefault();toast("רק מנהלים מזיזים יחידות");return}dragCode=c.dataset.open;c.classList.add("dragging");e.dataTransfer.effectAllowed="move"});
document.addEventListener("dragend",e=>{document.querySelectorAll(".dragging,.drop").forEach(x=>x.classList.remove("dragging","drop"))});
document.addEventListener("dragover",e=>{const col=e.target.closest&&e.target.closest(".col");if(col&&dragCode){e.preventDefault();document.querySelectorAll(".drop").forEach(x=>x!==col&&x.classList.remove("drop"));col.classList.add("drop")}});
document.addEventListener("drop",e=>{const col=e.target.closest&&e.target.closest(".col");if(!col||!dragCode)return;e.preventDefault();const u=get(dragCode);dragCode=null;col.classList.remove("drop");if(u.status!==col.dataset.col)setStatus(u,col.dataset.col)});

/* ---------- live-app helpers ---------- */
const addDays=(d,n)=>{const x=new Date(d+"T12:00");x.setDate(x.getDate()+n);return ymd(x)};
const nextSun=d=>{let x=addDays(d||TODAY,1);while(new Date(x+"T12:00").getDay()!==0)x=addDays(x,1);return x};
function editUnit(){
  const u=get(openCode);if(!u||!can())return;const isE=u.type==="epic";
  const others=U.filter(x=>x.code!==u.code&&x.type!=="epic");
  modal({h:`<div class="mh"><h3>עריכה · ${code(u.code)}</h3></div><form id="edform"><div class="mb">
    <label class="fld"><span>שם</span><input id="e-title" value="${esc(u.title)}"></label>
    <label class="fld"><span>אפיון</span><textarea id="e-desc">${esc(u.desc||"")}</textarea></label>
    <label class="fld"><span>הגדרת סיום</span><input id="e-dod" value="${esc(u.dod||"")}"></label>
    ${isE?`<label class="fld"><span>תוצר סיום</span><input id="e-deliv" value="${esc(u.deliverable||"")}"></label>`:""}
    <div class="row2"><label class="fld"><span>תאריך התחלה</span><input type="date" id="e-start" value="${u.start||""}"></label>
      <label class="fld"><span>סוג הדד-ליין</span><select id="e-dt">${Object.entries(DUE_TYPE).map(([k,t])=>`<option value="${k}"${u.dueType===k?" selected":""}>${t}</option>`).join("")}</select></label></div>
    <label class="fld"><span>למה דווקא התאריך הזה?</span><input id="e-dw" value="${esc(u.dueWhy||"")}"></label>
    <div class="row2"><label class="fld"><span>Area ראשי</span><select id="e-area">${Object.entries(AREAS).map(([k,a])=>`<option value="${k}"${u.area===k?" selected":""}>${esc(a[0])}</option>`).join("")}</select></label>
      ${isE?"":`<label class="fld"><span>מצב</span><select id="e-state"><option value="">רגיל</option>${Object.entries(STATES).map(([k,s])=>`<option value="${k}"${u.state===k?" selected":""}>${s[0]}</option>`).join("")}</select></label>`}</div>
    ${isE?"":`<label class="fld"><span>Blocked by</span><select id="e-bb"><option value="">אין</option>${others.map(x=>`<option value="${x.code}"${u.blockedBy===x.code?" selected":""}>${x.code} · ${esc(x.title)}</option>`).join("")}</select></label>
    <div class="fld"><span>מסלול ל-Done</span><div class="paths">${ORDER.map(s=>`<label><input type="checkbox" class="e-path" value="${s}" ${(u.path||ORDER).includes(s)?"checked":""} ${s==="todo"||s==="done"||s===u.status?"disabled":""}> ${ST[s][0]}</label>`).join("")}</div></div>
    <label class="fld" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="e-sp" ${inSp(u)?"checked":""}> <span>בספרינט הנוכחי (${spL()})</span></label>`}
    <label class="fld"><span>קישור לתיקיית דרייב</span><input id="e-drive" dir="ltr" value="${esc(u.drive||"")}" placeholder="https://drive.google.com/…"></label>
    <div class="req-note">דד-ליין, עדיפות ואחראי משנים מהכפתורים בחלון היחידה, כדי שהסיבה תישמר בהיסטוריה.</div>
  </div><div class="mf"><button type="button" class="btn danger" id="delu" style="margin-inline-end:auto">מחיקת היחידה</button><button type="button" class="btn" data-close>ביטול</button><button class="btn pri">שמירה</button></div></form>`});
  $("#delu").onclick=()=>{const ch=U.filter(x=>x.parent===u.code||(isE&&x.epic===u.code&&x.code!==u.code));
    if(ch.length){toast(`אי אפשר למחוק: יש תחתיה ${ch.length} יחידות (${ch.slice(0,4).map(x=>x.code).join(", ")}). מוחקים או מעבירים אותן קודם.`);return}
    if(!confirm(`למחוק לצמיתות את ${u.code} · ${u.title}?`))return;
    U=U.filter(x=>x!==u);persist();closeModal();closeAll();rerender();toast(`${u.code} נמחקה`)};
  $("#edform").onsubmit=e=>{e.preventDefault();const v=id=>($(id)?.value||"").trim();
    if(!v("#e-title")){$("#e-title").closest(".fld").classList.add("miss");return}
    const ch=[];const set=(k,val)=>{if((u[k]||"")!==(val||"")){ch.push(k);u[k]=val}};
    set("title",v("#e-title"));set("desc",v("#e-desc"));set("dod",v("#e-dod"));if(isE)set("deliverable",v("#e-deliv"));
    set("start",v("#e-start"));set("dueType",v("#e-dt"));set("dueWhy",v("#e-dw"));set("area",v("#e-area"));set("drive",v("#e-drive"));
    if(!isE){set("state",v("#e-state")||null);set("blockedBy",v("#e-bb")||null);
      const path=ORDER.filter(s=>{const c=document.querySelector(`.e-path[value="${s}"]`);return c.checked||c.disabled&&(u.path||ORDER).includes(s)||s===u.status});if(path.join()!==(u.path||ORDER).join()){u.path=path;ch.push("path")}
      const spv=$("#e-sp").checked?SPRINT.n:0;if((inSp(u)?SPRINT.n:0)!==spv){u.sprint=spv;ch.push("sprint")}}
    if(ch.length)(u.history=u.history||[]).push([now(),me,"ערך את היחידה ("+ch.length+" שדות)",""]);
    persist();closeModal();drawDrawer();rerender();toast(ch.length?"נשמר":"לא היה שינוי")};
}
function addLink(){
  const u=get(openCode);if(!u)return;
  modal({sm:1,h:`<div class="mh"><h3>קישור חדש · ${code(u.code)}</h3></div><form id="lkf"><div class="mb">
    <label class="fld"><span>סוג</span><select id="lk-k"><option value="sources">מקור · מה היחידה מתבססת עליו</option><option value="outputs">תוצר · מה היחידה יצרה</option></select></label>
    <label class="fld"><span>שם</span><input id="lk-t"></label>
    <label class="fld"><span>כתובת</span><input id="lk-u" dir="ltr" placeholder="https://"></label>
  </div><div class="mf"><button type="button" class="btn" data-close>ביטול</button><button class="btn pri">הוספה</button></div></form>`});
  $("#lkf").onsubmit=e=>{e.preventDefault();const t=$("#lk-t").value.trim(),l=$("#lk-u").value.trim();
    if(!t||!/^https?:\/\//.test(l)){toast("צריך שם וכתובת שמתחילה ב-https://");return}
    const k=$("#lk-k").value;(u[k]=u[k]||[]).push([t,l]);persist();closeModal();drawDrawer()};

function editGoal(){
  if(!can())return;
  modal({sm:1,h:`<div class="mh"><h3>הספרינט הנוכחי</h3></div><form id="gf"><div class="mb">
    <label class="fld"><span>מטרה</span><textarea id="g-goal">${esc(SPRINT.goal)}</textarea></label>
    <div class="row2"><label class="fld"><span>התחלה</span><input type="date" id="g-s" value="${SPRINT.start}"></label><label class="fld"><span>סיום</span><input type="date" id="g-e" value="${SPRINT.end}"></label></div>
  </div><div class="mf"><button type="button" class="btn" data-close>ביטול</button><button class="btn pri">שמירה</button></div></form>`});
  $("#gf").onsubmit=e=>{e.preventDefault();const st=$("#g-s").value,en=$("#g-e").value;if(!st||!en||en<st){toast("תאריכים לא תקינים");return}
    SPRINT={...SPRINT,goal:$("#g-goal").value.trim(),start:st,end:en,label:`שבוע ${+st.slice(8)}.${+st.slice(5,7)}–${fmt(en)}`};persist();closeModal();render()};
}
function resetAll(){
  if(!can())return;
  modal({sm:1,h:`<div class="mh"><h3>איפוס כל הנתונים</h3></div><form id="rsf"><div class="mb">
    <div class="req-note">נמחקים לצמיתות, אצל כולם: ${U.length} יחידות, ${DRAFTS.length} טיוטות, ${IDEAS.length} רעיונות וכל ההודעות. נשארים: רשימת ה-Areas ותאריכי הספרינט הנוכחי. אין דרך לשחזר.</div>
    <label class="fld"><span>כדי לאשר, כתבו <b>מחיקה</b></span><input id="rs-ok" autocomplete="off"></label>
  </div><div class="mf"><button type="button" class="btn" data-close>ביטול</button><button class="btn danger">מחיקת הכול</button></div></form>`});
  $("#rsf").onsubmit=e=>{e.preventDefault();if($("#rs-ok").value.trim()!=="מחיקה"){$("#rs-ok").closest(".fld").classList.add("miss");return}
    U=[];DRAFTS=[];IDEAS=[];Object.keys(MSGS).forEach(k=>MSGS[k]=[]);SPRINT={...SPRINT,goal:""};
    persist();closeModal();closeAll();view="mine";render();toast("כל הנתונים נמחקו. אפשר להתחיל ליצור Epics")};
}
function exportCsv(){
  const rows=filtered();const q=x=>`"${String(x??"").replace(/"/g,'""')}"`;
  const head=["קוד","שם","Epic","סטטוס","מצב","עדיפות","אחראי","Area","התחלה","דד-ליין","הגדרת סיום"];
  const lines=[head.map(q).join(","),...rows.map(u=>[u.code,u.title,u.epic,ST[u.status]?.[0],u.state?STATES[u.state][0]:"",u.prio,PEOPLE[u.owner]?.name,AREAS[u.area]?.[0],u.start,u.due,u.dod].map(q).join(","))];
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}));a.download=`addrio-tasks-${TODAY}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast(`ירדו ${rows.length} שורות. הקובץ נפתח באקסל`);
}
/* called by sync.js whenever remote data lands */
function onRemote(){
  TODAY=ymd(new Date());
  if(!me)return;
  const a=document.activeElement;const typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!=="q";
  if(!$("#main")){render();return}
  if(typing&&$("#main").contains(a)){clearTimeout(onRemote.t);onRemote.t=setTimeout(onRemote,1500);refreshCounters();return}
  rerender();
  if(openCode&&$("#drawer").classList.contains("on")&&!(typing&&$("#drawer").contains(a)))drawDrawer();
}
render();
